<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет — ТуТуТ</title>
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">
                <img src="images/logo.svg" alt="ТуТуТ" class="logo-img logo-img-light">
                <img src="images/logo-dark.svg" alt="ТуТуТ" class="logo-img logo-img-dark">
            </a>
            <nav id="headerNav">
                <a href="index.html">Главная</a>
                <a href="search.html">Квартиры</a>
                <div id="authButtons"></div>
            </nav>
            <div class="header-right">
                <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">
                    <img src="images/moon.png" alt="Тема" class="theme-icon-moon">
                    <img src="images/sun.png" alt="Тема" class="theme-icon-sun">
                </button>
                <button class="burger" id="burgerBtn" onclick="toggleMenu()">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </header>

    <main class="profile-page">
        <div class="container">
            <div class="profile-card">
                <div class="breadcrumbs">
                    <a href="index.html">Главная</a>
                    <span>/</span>
                    <span class="current">Личный кабинет</span>
                </div>

                <div class="profile-header">
                    <div class="profile-avatar" id="profileAvatar">?</div>
                    <div class="profile-info">
                        <h2 id="profileName">Загрузка...</h2>
                        <p id="profileEmail">...</p>
                        <span id="profileRoleBadge" style="display: none; font-size: 12px; padding: 2px 8px; border-radius: 4px; background: var(--bg-secondary); border: 1px solid var(--border); margin-top: 4px;">Гость</span>
                    </div>
                </div>

                <div class="profile-tabs">
                    <button class="profile-tab active" id="tabBtnProfile" onclick="switchTab('profile')">
                        Профиль
                    </button>
                    <button class="profile-tab" id="tabBtnBookings" onclick="switchTab('bookings')">
                        Мои бронирования
                    </button>
                </div>

                <div id="tab-profile" class="profile-tab-content active">
                    <form id="profileForm">
                        <div class="form-group">
                            <label>Имя</label>
                            <input type="text" id="editName" maxlength="50" required>
                        </div>
                        <div class="form-group">
                            <label>Email (логин)</label>
                            <input type="email" id="editEmail" maxlength="100" disabled>
                        </div>
                        <div class="form-group">
                            <label>Контактный телефон</label>
                            <input type="tel" id="editPhone" placeholder="+7 (999) 123-45-67" maxlength="20">
                        </div>
                        <button type="submit" class="btn">Сохранить изменения</button>
                    </form>
                    <div class="profile-section" style="margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border)">
                        <button class="btn btn-outline" onclick="logout(event)" style="border-color: #dc3545; color: #dc3545">
                            Выйти из аккаунта
                        </button>
                    </div>
                </div>

                <div id="tab-bookings" class="profile-tab-content">
                    <div id="bookingsList"></div>
                    <div id="noBookings" class="empty-state" style="display: none">
                        <p>У вас пока нет бронирований</p>
                        <a href="search.html" class="btn">Найти квартиру</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>2016-2026 ТуТуТ — Сервис аренды квартир на сутки</p>
            <a href="#">Пользовательское соглашение</a>
        </div>
    </footer>

    <!-- Модальные окна аутентификации -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('loginModal')">×</button>
            <h2>Вход в аккаунт</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="example@mail.ru" required maxlength="100">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="loginPassword" placeholder="Введите пароль" required maxlength="50">
                </div>
                <button type="submit" class="btn">Войти</button>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/dates.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/profile.js"></script>
    <script>
        function switchTab(tab) {
            document.querySelectorAll('.profile-tab').forEach(function(b) { b.classList.remove('active'); });
            document.querySelectorAll('.profile-tab-content').forEach(function(c) { c.classList.remove('active'); });
            var tabBtn = document.getElementById('tabBtn' + tab.charAt(0).toUpperCase() + tab.slice(1));
            var tabContent = document.getElementById('tab-' + tab);
            if (tabBtn) tabBtn.classList.add('active');
            if (tabContent) tabContent.classList.add('active');
            if (tab === 'bookings') showBookings();
        }

        initTheme();
        checkAuth();
        loadProfile();

        var initialTab = getUrlParameter('tab');
        if (initialTab === 'bookings') {
            switchTab('bookings');
        } else {
            showBookings();
        }
    </script>
</body>
</html>

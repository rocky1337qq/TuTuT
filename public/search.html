<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ТуТуТ</title>
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">
                <img src="images/logo.svg" alt="ТуТуТ" class="logo-img logo-img-light">
                <img src="images/logo-dark.svg" alt="ТуТуТ" class="logo-img logo-img-dark">
            </a>
            <nav id="headerNav">
                <a href="index.html">Главная</a>
                <a href="search.html" class="active">Квартиры</a>
                <div id="authButtons"></div>
            </nav>
            <div class="header-right">
                <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">
                    <img src="images/moon.png" alt="Тема" class="theme-icon-moon">
                    <img src="images/sun.png" alt="Тема" class="theme-icon-sun">
                </button>
                <button class="burger" id="burgerBtn" onclick="toggleMenu()">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </header>

    <main class="search-page">
        <div class="container">
            <div class="breadcrumbs">
                <a href="index.html">Главная</a>
                <span>/</span>
                <span class="current">Квартиры</span>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; flex-wrap: wrap; gap: 14px;">
                <div>
                    <h1 class="section-title" style="margin-bottom: 4px;">Квартиры в Оренбурге</h1>
                    <p style="color: var(--text-secondary); font-size: 14px;" id="resultsCount">Загрузка вариантов...</p>
                </div>
                <div style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap;">
                    <label id="onlyAvailableWrapper" style="display: none; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; cursor: pointer; user-select: none;">
                        <input type="checkbox" id="onlyAvailableCheckbox" checked style="accent-color: var(--accent); width: 16px; height: 16px;">
                        Только свободные
                    </label>
                    <button class="btn btn-outline" id="resetDatesBtn" style="padding: 6px 12px; font-size: 13px; display: none;">Сбросить даты</button>
                </div>
            </div>

            <div class="date-filter" style="background: var(--bg-card); padding: 16px 20px; border-radius: 14px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); margin-bottom: 24px;">
                <div>
                    <label style="font-weight: 600; font-size: 13px;">Заезд:</label>
                    <div class="date-input-wrapper">
                        <input type="text" id="checkinInput" placeholder="Выберите дату" readonly autocomplete="off">
                        <svg class="calendar-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                    </div>
                </div>
                <div>
                    <label style="font-weight: 600; font-size: 13px;">Выезд:</label>
                    <div class="date-input-wrapper">
                        <input type="text" id="checkoutInput" placeholder="Выберите дату" readonly autocomplete="off">
                        <svg class="calendar-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                    </div>
                </div>
            </div>

            <div class="listings-grid" id="listingsGrid"></div>
            <div class="no-results" id="noResults" style="display:none">
                Нет доступных квартир на выбранные даты
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>2016-2026 ТуТуТ — Сервис аренды квартир на сутки</p>
            <a href="#">Пользовательское соглашение</a>
        </div>
    </footer>


    <div class="modal" id="loginModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('loginModal')">x</button>
            <h2>Вход в аккаунт</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email или телефон</label>
                    <input type="text" id="loginEmail" placeholder="example@mail.ru" required maxlength="100">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="loginPassword" placeholder="Введите пароль" required maxlength="50">
                </div>
                <button type="submit" class="btn">Войти</button>
            </form>
            <div class="modal-footer">
                Нет аккаунта? 
                <a href="#" onclick="event.preventDefault(); closeModal('loginModal'); openModal('registerModal')">
                    Зарегистрироваться
                </a>
            </div>
        </div>
    </div>

    <div class="modal" id="registerModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('registerModal')">x</button>
            <h2>Регистрация</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label>Ваше имя</label>
                    <input type="text" id="regName" placeholder="Иван" required maxlength="50">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="regEmail" placeholder="example@mail.ru" required maxlength="100">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="regPassword" placeholder="Минимум 6 символов" required minlength="6" maxlength="50">
                </div>
                <button type="submit" class="btn">Зарегистрироваться</button>
            </form>
            <div class="modal-footer">
                Уже есть аккаунт? 
                <a href="#" onclick="event.preventDefault(); closeModal('registerModal'); openModal('loginModal')">
                    Войти
                </a>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/dates.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/datepicker.js"></script>
    <script src="js/listings.js"></script>
    <script>
        var checkinParam = getUrlParameter('checkin');
        var checkoutParam = getUrlParameter('checkout');
        var checkinInput = document.getElementById('checkinInput');
        var checkoutInput = document.getElementById('checkoutInput');

        if (checkinParam) checkinInput.value = checkinParam;
        if (checkoutParam) checkoutInput.value = checkoutParam;

        initTheme();
        checkAuth();

        var datePicker = new DatePicker({
            checkinInputId: 'checkinInput',
            checkoutInputId: 'checkoutInput',
            initialCheckin: checkinParam,
            initialCheckout: checkoutParam,
            onSelect: function(inDate, outDate) {
                showApartments();
            }
        });

        var resetBtn = document.getElementById('resetDatesBtn');
        if (resetBtn) {
            resetBtn.onclick = function() {
                checkinInput.value = '';
                checkoutInput.value = '';
                datePicker.checkinDate = null;
                datePicker.checkoutDate = null;
                showApartments();
            };
        }

        var onlyAvailCheckbox = document.getElementById('onlyAvailableCheckbox');
        if (onlyAvailCheckbox) {
            onlyAvailCheckbox.onchange = showApartments;
        }

        showApartments();
    </script>
</body>
</html>
